{% extends "base.html" %}
{% block title %}Settings{% endblock %}

{% block content %}
    <form method="post" class="box">
        {% for t in thresholds %}
            <div class="settings-row">
                <div>{{ t.sensorType.type }} warning</div>
                <input type="number" step="0.1" name="warning-{{ t.id }}" value="{{ t.warningVal }}">
                <input type="number" step="0.1" name="critical-{{ t.id }}" value="{{ t.criticalVal }}">
            </div>
        {% else %}
            No thresholds configured yet.
        {% endfor %}
        <button type="submit" style="margin-top: 12px; padding: 8px 16px;">Save</button>
    </form>
{% endblock %}
